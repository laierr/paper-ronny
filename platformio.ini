[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  zinggjm/GxEPD2@^1.6.5
  bblanchon/ArduinoJson@^7.4.2
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DEPD_CS=5
  -DEPD_DC=17
  -DEPD_RST=16
  -DEPD_BUSY=4
  -DEPD_SCK=18
  -DEPD_MOSI=23
monitor_filters = esp32_exception_decoder
