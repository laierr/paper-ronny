[package]
name = "paper-ronny"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "paper-ronny"
harness = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
embedded-graphics = "0.8.2"
embedded-hal = "1"
embedded-svc = "0.29"
epdsi = "0.6.0"
esp-idf-svc = { version = "=0.52.1", features = ["pio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# esp-idf-sys 0.38.1 expects the pre-0.33.5 PlatformIO metadata shape.
embuild = "=0.33.3"

[profile.release]
opt-level = "s"
lto = false
codegen-units = 1
strip = true

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.3.3"
esp_idf_tools_install_dir = "global"

[patch.crates-io]
# 0.37.2 predates embuild's optional PlatformIO framework path field.
esp-idf-sys = { path = "third_party/esp-idf-sys" }
